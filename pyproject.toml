[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-light"
version = "0.1.0"
description = "Open-source traffic light intersection simulator for classrooms (Windows & Linux)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
traffic-light = "traffic_light.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traffic_light = ["assets/*", "i18n/*.qm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
